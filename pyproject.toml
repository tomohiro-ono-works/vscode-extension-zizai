[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zizai-runtime"
version = "0.0.3.dev0"
description = "Python package foundation for ZizAI notebooks"
readme = "docs/usage.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
forms = ["ipywidgets==8.1.9", "PyYAML==6.0.3"]
bigquery = ["google-cloud-bigquery[pandas]==3.47.0", "pandas==3.1.1", "numpy==2.5.4", "pyarrow==26.0.1"]
csv = ["pandas==3.1.1", "numpy==2.5.4"]
dataintegration = ["pandas==3.1.1", "numpy==2.5.4"]
duckdb = ["duckdb==2.0.0", "pandas==3.1.1", "numpy==2.5.4"]
excel = ["pandas==3.1.1", "numpy==2.5.4", "openpyxl==3.1.5", "defusedxml==0.7.1"]
python = ["pandas==3.1.1", "numpy==2.5.4"]
shell = ["pandas==3.1.1", "numpy==2.5.4"]
vector = [
    "duckdb==2.0.0", "pandas==3.1.1", "numpy==2.5.4",
    "sentence-transformers==6.3.0", "torch==2.15.0", "transformers==5.23.0",
]
windows = ["pandas==3.1.1", "numpy==2.5.4"]

[tool.setuptools]
packages = [
    "zizai", "zizai.core", "zizai.connector_forms",
    "zizai.connector_forms.bigquery",
    "zizai.connector_forms.csv",
    "zizai.connector_forms.dataintegration",
    "zizai.connector_forms.duckdb",
    "zizai.connector_forms.excel",
    "zizai.connector_forms.python",
    "zizai.connector_forms.shell",
    "zizai.connector_forms.vector",
    "zizai.connector_forms.windows",
]
include-package-data = false

[tool.setuptools.package-dir]
zizai = "src"
"zizai.connector_forms.bigquery" = "connectors/bigquery/form"
"zizai.connector_forms.csv" = "connectors/csv/form"
"zizai.connector_forms.dataintegration" = "connectors/dataintegration/form"
"zizai.connector_forms.duckdb" = "connectors/duckdb/form"
"zizai.connector_forms.excel" = "connectors/excel/form"
"zizai.connector_forms.python" = "connectors/python/form"
"zizai.connector_forms.shell" = "connectors/shell/form"
"zizai.connector_forms.vector" = "connectors/vector/form"
"zizai.connector_forms.windows" = "connectors/windows/form"

[tool.setuptools.package-data]
zizai = ["forms.yaml", "form.css"]

[tool.setuptools.data-files]
"share/jupyter/nbextensions/zizai-row-preview" = [
    "src/widgets/row_preview/extension.js",
    "src/widgets/row_preview/index.js",
]
