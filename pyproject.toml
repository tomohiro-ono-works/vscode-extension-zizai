[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zizai-runtime"
version = "0.0.2.dev0"
description = "Python package foundation for ZizAI notebooks"
readme = "apps/core/README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
forms = ["ipywidgets==8.1.9", "PyYAML==6.0.3"]
csv = ["pandas==3.0.1", "numpy==2.4.2"]

[tool.setuptools]
packages = ["zizai", "zizai.core", "zizai.connectors"]
include-package-data = false

[tool.setuptools.package-dir]
zizai = "apps/core/src/zizai"
"zizai.connectors" = "apps/connectors/src/zizai/connectors"

[tool.setuptools.package-data]
zizai = ["forms.yaml"]
