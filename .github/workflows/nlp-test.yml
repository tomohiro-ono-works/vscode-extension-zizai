name: NLP tests
on:
  push:
    branches: [feature/nlp-connector]
  workflow_dispatch:
jobs:
  nlp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas ginza ja-ginza scikit-learn networkx keybert pytest
      - run: python -m pytest tests/unit/python/test_nlp_connector.py -v -rs
