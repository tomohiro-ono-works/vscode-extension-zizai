name: Knowledge tests
on:
  push:
    branches: [feature/knowledge-connector]
  workflow_dispatch:
jobs:
  knowledge:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "rdflib>=7.1,<8" pandas PyYAML
      - run: python -m unittest discover -s connectors/knowledge -p "test_*.py" -v
      - run: python -m compileall -q connectors/knowledge
