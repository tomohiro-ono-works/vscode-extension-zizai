version: 1
output_template: "{connector}.{action}のコードを生成"
connectors:
  nlp:
    label: NLP
    module_file: nlp_connector.py
    actions:
      normalize_text:
        label: 正規化
        generation: nlp.normalize_text
        fields:
          input_mode: {label: 入力形式, type: choice, choices: [text, dataframe], default: text}
          text: {label: 原文, type: text}
          input_variable: {label: 入力変数, type: text, default: df}
          text_column: {label: 文章列, type: text, default: text}
          id_column: {label: ID列, type: text}
          output_variable: {label: 出力変数, type: text, default: result, required: true}
          form: {label: Unicode正規化形式, type: choice, choices: [NFC, NFD, NFKC, NFKD], default: NFKC, required: true}
          collapse_whitespace: {label: 連続する空白の統一, type: checkbox, default: true}
          lowercase: {label: 小文字化, type: checkbox, default: false}
      analyze_text:
        label: 自然言語解析
        generation: nlp.analyze_text
        fields:
          input_mode: {label: 入力形式, type: choice, choices: [text, dataframe], default: text}
          text: {label: 原文, type: text}
          input_variable: {label: 入力変数, type: text, default: df}
          text_column: {label: 文章列, type: text, default: text}
          id_column: {label: ID列, type: text}
          output_variable: {label: 出力変数, type: text, default: result, required: true}
          model: {label: 解析モデル, type: text, default: ja_ginza, required: true}
          enable_coreference: {label: 共参照解析（既定は限定的なヒューリスティック）, type: checkbox, default: true}
          resolver_variable: {label: 共参照解析関数の変数名（省略可）, type: text}
      analyze_keyword_importance:
        label: キーワード重要度分析
        generation: nlp.analyze_keyword_importance
        fields:
          input_mode: {label: 入力形式, type: choice, choices: [text, dataframe], default: text}
          text: {label: 原文, type: text}
          input_variable: {label: 入力変数, type: text, default: df}
          text_column: {label: 文章列, type: text, default: text}
          id_column: {label: ID列, type: text}
          output_variable: {label: 出力変数, type: text, default: result, required: true}
          method: {label: 分析手法, type: choice, choices: [tfidf, textrank, keybert], required: true}
          embedding_model: {label: 埋め込みモデル名またはローカルパス, type: text, default: cl-nagoya/ruri-v3-130m}
          corpus_variable: {label: 参照文書リスト変数（TF-IDF用）, type: text}
          model: {label: 解析モデル, type: text, default: ja_ginza, required: true}
