version: 1
output_template: "{connector}.{action}のコードを生成"
connectors:
  vector:
    label: Vector
    module_file: vector_connector.py
    actions:
      embedding_vector_db:
        label: ベクトルDB構築・更新
        generation: vector.embedding_vector_db
        fields:
          db_folder: {label: ベクトルDBのフォルダー, type: folder, required: true}
          collection_name: {label: コレクション名, type: text, default: default, required: true}
          input_variable: {label: 入力DataFrame, type: text, required: true}
          id_column: {label: ID列, type: text, default: id, required: true}
          text_column: {label: テキスト列, type: text, default: text, required: true}
          metric: {label: 検索方式, type: choice, choices: [コレクションに従う（新規はコサイン）, コサイン類似度, ユークリッド距離, 内積, マンハッタン距離], default: コレクションに従う（新規はコサイン）}
          model_name: {label: 埋め込みモデル（省略可）, type: text}
          output_variable: {label: 出力変数, type: text, default: result, required: true}
          enable_correction: {label: 補正検索を有効にする, type: checkbox, default: false}
          regularization: {label: 正則化係数（既定 0.001）, type: text}
          density_k: {label: 近傍件数（既定 10）, type: text}
          penalty_weight: {label: ペナルティ係数（既定 0.25）, type: text}
      search_vector_db:
        label: ベクトル検索
        generation: vector.search_vector_db
        fields:
          db_folder: {label: ベクトルDBのフォルダー, type: folder, required: true}
          collection_name: {label: コレクション名, type: text, default: default, required: true}
          query_text: {label: 検索文, type: textarea, required: true}
          top_k: {label: 取得件数, type: integer, minimum: 1, default: 5, required: true}
          search_mode: {label: 検索モード, type: choice, choices: [通常検索, 補正あり, 通常コサインと比較], default: 通常検索, required: true}
          include_vector: {label: 元のベクトルを結果に含める, type: checkbox, default: false}
          output_variable: {label: 出力変数, type: text, default: df, required: true}
