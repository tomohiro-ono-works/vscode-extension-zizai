version: 1
output_template: "{connector}.{action}のコードを生成"
connectors:
  dataintegration:
    label: データ統合
    module_file: dataintegration_connector.py
    actions:
      apply_column_operations:
        label: 列操作
        generation: dataintegration.apply_column_operations
        fields:
          input_variable: {label: 入力DataFrame, type: text, required: true}
          output_variable: {label: 出力変数, type: text, default: processed_df, required: true}
          operations: {label: 列操作, type: textarea, required: true}
      apply_data_operations:
        label: 条件・値加工
        generation: dataintegration.apply_data_operations
        fields:
          input_variable: {label: 入力DataFrame, type: text, required: true}
          output_variable: {label: 出力変数, type: text, default: processed_df, required: true}
          operations: {label: 処理, type: textarea, required: true}
      sort_rows:
        label: 行の並べ替え
        generation: dataintegration.sort_rows
        fields:
          input_variable: {label: 入力DataFrame, type: text, required: true}
          output_variable: {label: 出力変数, type: text, default: sorted_df, required: true}
          operations: {label: 並べ替えの設定, type: textarea, required: true}
      aggregate_rows:
        label: 集計
        generation: dataintegration.aggregate_rows
        fields:
          input_variable: {label: 入力DataFrame, type: text, required: true}
          output_variable: {label: 出力変数, type: text, default: aggregated_df, required: true}
          operations: {label: 集計の設定, type: textarea, required: true}
      combine_frames:
        label: 結合・差集合
        generation: dataintegration.combine_frames
        fields:
          input_variable: {label: 左のDataFrame, type: text, required: true}
          output_variable: {label: 出力変数, type: text, default: combined_df, required: true}
          operations: {label: 結合の設定, type: textarea, required: true}
      reshape_rows:
        label: 構造変更
        generation: dataintegration.reshape_rows
        fields:
          input_variable: {label: 入力DataFrame, type: text, required: true}
          output_variable: {label: 出力変数, type: text, default: reshaped_df, required: true}
          operations: {label: 構造変更の設定, type: textarea, required: true}
      replace_fields_forrenamelist:
        label: RENAMEリストで列名変更
        generation: dataintegration.replace_fields_forrenamelist
        fields:
          input_variable: {label: 入力変数, type: text, required: true}
          file_path: {label: RENAMEリスト, type: file, extension: .csv, required: true}
          output_variable: {label: 出力変数, type: text, default: renamed_df, required: true}
          remove_spaces: {label: 変更前に全角・半角スペースを削除, type: checkbox}
          remove_newlines: {label: 変更前に改行を削除, type: checkbox}
          to_halfwidth_alnum: {label: 変更前に全角英数字を半角に変換, type: checkbox}
          symbols_to_snake: {label: 変更前に半角記号をアンダースコアに変換, type: checkbox}
          exclude_japanese_columns: {label: 変更後に日本語を含む列を除外, type: checkbox}
