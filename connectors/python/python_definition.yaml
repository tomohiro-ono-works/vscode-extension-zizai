version: 1
output_template: "{connector}.{action}のコードを生成"
connectors:
  python:
    label: Python
    module_file: python_connector.py
    actions:
      execute_python:
        label: Python実行
        generation: python.execute_python
        fields:
          env_path: {label: Python実行ファイルまたは仮想環境のパス（省略可）, type: text}
          script: {label: Pythonコード（main()を定義）, type: textarea, required: true}
          output_variable: {label: 出力変数, type: text, default: result, required: true}
