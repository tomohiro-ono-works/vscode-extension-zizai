version: 1
output_template: "{connector}.{action}のコードを生成"
connectors:
  python:
    label: Python
    module_file: python_connector.py
    actions:
      execute_python:
        label: Python実行（ファイル）
        generation: python.execute_python_file
        fields:
          env_path: {label: Python実行ファイルまたは仮想環境のパス（省略可）, type: text}
          folder: {label: Pythonファイルのフォルダー, type: folder, required: true}
          filename: {label: Pythonファイル名, type: text, required: true}
          output_variable: {label: 出力変数, type: text, default: result, required: true}
